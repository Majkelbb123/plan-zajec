<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Plan zajęć — Biotechnologia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Układ: pasek z tygodniem i filtrami na górze, pod nim 5 kolumn (pon–pt) z kartami zajęć; na telefonie dni jeden pod drugim */
:root {
  --bg: #F1F3F6;
  --surface: #FFFFFF;
  --ink: #18202E;
  --muted: #667085;
  --line: #DCE1E8;
  --accent: #1F4FA8;
  --today: #FFF6DB;
  --today-line: #E3B23C;

  --wyk: #1F5FC7;   --wyk-bg: #EAF1FC;
  --cwA: #1E7A45;   --cwA-bg: #E9F5EE;
  --cwL: #B5541B;   --cwL-bg: #FCEFE6;
  --cwK: #6B3FC9;   --cwK-bg: #F1ECFC;
  --lang: #0D7487;  --lang-bg: #E5F5F8;
  --event: #596273; --event-bg: #ECEEF2;

  --f-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F141C; --surface: #171E29; --ink: #E6EAF0; --muted: #8E99AB; --line: #283243;
    --accent: #7FA6F0; --today: #2A2617; --today-line: #C99A2E;
    --wyk: #7FA6F0;  --wyk-bg: #18243A;
    --cwA: #5CC48A;  --cwA-bg: #15291F;
    --cwL: #F0955A;  --cwL-bg: #2E1F16;
    --cwK: #B497F5;  --cwK-bg: #241D38;
    --lang: #4FC3D6; --lang-bg: #13282D;
    --event: #A3ADBD; --event-bg: #222A36;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F141C; --surface: #171E29; --ink: #E6EAF0; --muted: #8E99AB; --line: #283243;
  --accent: #7FA6F0; --today: #2A2617; --today-line: #C99A2E;
  --wyk: #7FA6F0;  --wyk-bg: #18243A;
  --cwA: #5CC48A;  --cwA-bg: #15291F;
  --cwL: #F0955A;  --cwL-bg: #2E1F16;
  --cwK: #B497F5;  --cwK-bg: #241D38;
  --lang: #4FC3D6; --lang-bg: #13282D;
  --event: #A3ADBD; --event-bg: #222A36;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--f-sans);
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── Nagłówek ── */
header { padding-block: 22px 14px; display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
.meta { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.02em; }

/* ── Pasek sterowania (przyklejony u góry) ── */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface);
  border-block: 1px solid var(--line);
}
.bar .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; padding-block: 10px; }
.week { display: flex; align-items: center; gap: 6px; }
.week button {
  font: 600 1rem var(--f-sans); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; width: 34px; height: 34px; cursor: pointer;
}
.week button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.week button:disabled { opacity: 0.35; cursor: default; }
.week-label { min-width: 13ch; text-align: center; }
.week-label strong { display: block; font-size: 1rem; font-variant-numeric: tabular-nums; }
.week-label span { font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); }
.today-btn { width: auto !important; padding: 0 10px; font-size: 0.8rem !important; }

.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
select {
  font: 0.88rem var(--f-sans); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 120px; cursor: pointer;
}
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.72rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* ── Ogłoszenie tygodnia ── */
.note {
  margin-top: 18px; padding: 12px 14px; border-radius: 8px;
  background: var(--today); border: 1px solid var(--today-line); max-width: 75ch;
}

/* ── Siatka: oś godzin po lewej + 5 kolumn dni ── */
.sched-scroll { overflow-x: auto; margin-block: 18px 40px; }
.sched {
  --hour: 72px;                       /* wysokość jednej godziny */
  display: grid; grid-template-columns: 48px repeat(5, minmax(128px, 1fr));
  min-width: 700px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.corner, .times { position: sticky; left: 0; z-index: 3; background: var(--surface); border-right: 1px solid var(--line); }
.day-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
  padding: 10px 8px 8px; border-bottom: 2px solid var(--ink); border-left: 1px solid var(--line);
}
.day-head b { font-size: 0.9rem; }
.day-head span { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); }
.day-head.is-today { border-bottom-color: var(--today-line); background: var(--today); }
.day-head.is-today span { color: var(--ink); }
.day-head.is-today span::after { content: " · dziś"; font-family: var(--f-sans); font-weight: 600; color: var(--today-line); }
.corner { border-bottom: 2px solid var(--ink); }

.times { position: sticky; }
.times div {
  position: absolute; right: 6px; transform: translateY(-50%);
  font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums;
}
.times div:first-child { transform: none; }
.col {
  position: relative; border-left: 1px solid var(--line);
  /* linie co godzinę (ciągłe) i co pół godziny (przerywane) */
  background:
    repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hour)),
    repeating-linear-gradient(to bottom, transparent 0 calc(var(--hour) / 2), color-mix(in srgb, var(--line) 55%, transparent) calc(var(--hour) / 2) calc(var(--hour) / 2 + 1px), transparent calc(var(--hour) / 2 + 1px) var(--hour));
}
.col.is-today { background-color: var(--today); }
.now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--today-line); z-index: 2; pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--today-line); }

.card {
  --c: var(--wyk); --cb: var(--wyk-bg);
  position: absolute; overflow: hidden;
  background: var(--cb); border-left: 3px solid var(--c); border-radius: 4px;
  padding: 4px 6px; display: flex; flex-direction: column; gap: 1px;
  box-shadow: 0 0 0 1px var(--surface);
}
/* Rozwinięcie pełnego opisu: najechanie myszką (komputer) albo dotknięcie (telefon) */
@media (hover: hover) {
  .card:hover { z-index: 4; overflow: visible; height: auto !important; min-height: var(--h); box-shadow: 0 4px 14px rgb(0 0 0 / 0.18); }
}
.card.open { z-index: 4; overflow: visible; height: auto !important; min-height: var(--h); box-shadow: 0 4px 14px rgb(0 0 0 / 0.18); }
.card { cursor: pointer; }
.free { position: absolute; inset: 24px 8px auto; text-align: center; color: var(--muted); font-size: 0.85rem; }

/* Zakładki dni — widoczne tylko na telefonie */
.day-tabs { display: none; }
.card.cwA { --c: var(--cwA); --cb: var(--cwA-bg); }
.card.cwL { --c: var(--cwL); --cb: var(--cwL-bg); }
.card.cwK { --c: var(--cwK); --cb: var(--cwK-bg); }
.card.lang { --c: var(--lang); --cb: var(--lang-bg); }
.card.event { --c: var(--event); --cb: var(--event-bg); }
.card.now { box-shadow: 0 0 0 2px var(--today-line); }
.time { font-family: var(--f-mono); font-size: 0.68rem; font-weight: 600; color: var(--c); font-variant-numeric: tabular-nums; }
.subj { font-weight: 600; font-size: 0.78rem; line-height: 1.25; overflow-wrap: anywhere; }
.prof { font-size: 0.7rem; color: var(--muted); }
.room { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.tag {
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px; background: var(--c); color: var(--surface);
}
.tag.alt { background: transparent; color: var(--c); border: 1px solid var(--c); }
.tag.warn { background: var(--today-line); color: #1A1406; }

.hint { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }

@media (max-width: 900px) {
  .legend { display: none; }
}
/* ── Telefon: jeden dzień na ekranie ── */
@media (max-width: 700px) {
  header { padding-block: 14px 10px; }
  h1 { font-size: 1.15rem; }
  .meta { font-size: 0.68rem; }
  .bar .wrap { gap: 8px 10px; padding-block: 8px; }
  .week { width: 100%; justify-content: space-between; }
  .week button { width: 40px; height: 40px; }
  .field { flex: 1 1 40%; }
  .field label { font-size: 0.62rem; }
  select { min-width: 0; width: 100%; padding: 8px; font-size: 0.95rem; }

  .day-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; }
  .day-tabs button {
    font: inherit; color: var(--ink); background: var(--bg); cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 0 4px;
    display: flex; flex-direction: column; align-items: center; line-height: 1.15;
  }
  .day-tabs b { font-size: 0.82rem; }
  .day-tabs span { font-family: var(--f-mono); font-size: 0.66rem; color: var(--muted); }
  .day-tabs .is-today { border-color: var(--today-line); background: var(--today); }
  .day-tabs [aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .day-tabs [aria-pressed="true"] span { color: var(--surface); }

  .sched-scroll { margin-block: 10px 32px; overflow-x: visible; }
  .sched { --hour: 68px; min-width: 0; grid-template-columns: 42px minmax(0, 1fr); }
  .times div { right: 5px; font-size: 0.66rem; }
  .subj { font-size: 0.86rem; }
  .time, .room, .prof { font-size: 0.74rem; }
  .hint { font-size: 0.72rem; }
}
</style>

  <div class="sched-scroll"><div id="sched" class="sched"></div></div>
</main>

const DAYS = ['Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek'];
const TYPE_LABEL = { wyk: 'Wykład', cwA: 'Ćw. audyt.', cwL: 'Ćw. lab.', cwK: 'Ćw. komp.', lang: 'Język', event: 'Wydarzenie' };

// Bezpieczne wstawianie tekstu do HTML
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const minutes = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const ddmm = iso => iso.slice(8, 10) + '.' + iso.slice(5, 7);

// Dzisiejsza data jako "RRRR-MM-DD" (czas lokalny)
function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Który tydzień pokazać na start: bieżący, a w weekend / przerwie — najbliższy następny
function currentWeekIndex() {
  const t = todayIso();
  const i = WEEKS.findIndex(w => t <= w.dni[4]);
  return i === -1 ? WEEKS.length - 1 : i;
}

// Pamiętanie wybranych grup w przeglądarce (może nie działać np. w trybie prywatnym)
function load(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

const selAudyt = document.getElementById('selAudyt');
const selLab = document.getElementById('selLab');
selAudyt.value = load('plan-audyt');
selLab.value = load('plan-lab');
let week = currentWeekIndex();

// Telefon = wąski ekran -> pokazujemy jeden dzień
const mobile = window.matchMedia('(max-width: 700px)');
const SHORT = ['Pn', 'Wt', 'Śr', 'Cz', 'Pt'];

// Domyślny dzień: dzisiejszy, jeśli oglądamy bieżący tydzień, inaczej poniedziałek
function defaultDay() {
  const i = WEEKS[week].dni.indexOf(todayIso());
  return i === -1 ? 0 : i;
}
let day = defaultDay();

// Przejście o dzień do przodu/tyłu (z piątku na poniedziałek następnego tygodnia)
function shiftDay(step) {
  day += step;
  if (day > 4) { if (week < WEEKS.length - 1) { week++; day = 0; } else day = 4; }
  if (day < 0) { if (week > 0) { week--; day = 4; } else day = 0; }
  render();
}

function visible(z) {
  if (z.gtyp === 'audyt') return !selAudyt.value || z.gval === selAudyt.value;
  if (z.gtyp === 'lab') return !selLab.value || String(z.gval) === selLab.value;
  return true;
}

const nowMinutes = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };

// Zajęcia, które nachodzą na siebie czasowo, dostają osobne "tory" (stoją obok siebie)
function assignLanes(items) {
  let group = [], groupEnd = -1;
  const close = () => {
    const laneEnds = [];
    group.forEach(z => {
      let i = laneEnds.findIndex(end => end <= minutes(z.od));
      if (i === -1) { i = laneEnds.length; laneEnds.push(0); }
      laneEnds[i] = minutes(z.do);
      z.lane = i;
    });
    group.forEach(z => { z.lanes = laneEnds.length; });
  };
  items.forEach(z => {
    if (group.length && minutes(z.od) >= groupEnd) { close(); group = []; groupEnd = -1; }
    group.push(z);
    groupEnd = Math.max(groupEnd, minutes(z.do));
  });
  if (group.length) close();
}

// Jeden blok zajęć: pozycja od góry = godzina rozpoczęcia, wysokość = czas trwania
function card(z, isToday, startMin, hourPx) {
  const live = isToday && nowMinutes() >= minutes(z.od) && nowMinutes() < minutes(z.do);
  const top = (minutes(z.od) - startMin) / 60 * hourPx;
  const h = (minutes(z.do) - minutes(z.od)) / 60 * hourPx;
  const tags = [];
  if (z.gtyp !== 'all') tags.push(`<span class="tag">gr. ${esc(z.gval)}</span>`);
  z.uwagi.forEach(u => tags.push(`<span class="tag warn">${esc(u)}</span>`));
  if (live) tags.push('<span class="tag warn">Trwa teraz</span>');
  const tip = [z.od + '–' + z.do, z.przedmiot, TYPE_LABEL[z.typ], z.prof, z.sala, z.gtyp !== 'all' ? 'gr. ' + z.gval : '', z.nr ? 'zajęcia nr ' + z.nr : ''].filter(Boolean).join('\n');
  const style = `top:${top + 1}px;height:${h - 2}px;--h:${h - 2}px;` +
    `left:calc(${z.lane} * 100% / ${z.lanes} + 2px);width:calc(100% / ${z.lanes} - 4px)`;
  return `<div class="card ${z.typ}${live ? ' now' : ''}" style="${style}" title="${esc(tip)}">
    <div class="time">${z.od}–${z.do}</div>
    <div class="subj">${esc(z.przedmiot)}</div>
    ${z.sala ? `<div class="room">${esc(z.sala)}</div>` : ''}
    ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
    ${z.prof ? `<div class="prof">${esc(z.prof)}</div>` : ''}
  </div>`;
}

function render() {
  const w = WEEKS[week];
  const t = todayIso();
  document.getElementById('weekName').textContent = ddmm(w.dni[0]) + '–' + ddmm(w.dni[4]) + '.' + w.dni[4].slice(0, 4);
  document.getElementById('weekNo').textContent = `tydzień ${week + 1} z ${WEEKS.length}`;
  document.getElementById('prev').disabled = week === 0;
  document.getElementById('next').disabled = week === WEEKS.length - 1;
  document.getElementById('todayBtn').disabled = week === currentWeekIndex();

  const note = document.getElementById('note');
  note.hidden = !w.uwaga;
  note.textContent = w.uwaga;

  // Zakładki dni (CSS pokazuje je tylko na telefonie)
  document.getElementById('dayTabs').innerHTML = SHORT.map((s, d) =>
    `<button type="button" data-day="${d}" aria-pressed="${d === day}" class="${w.dni[d] === t ? 'is-today' : ''}">` +
    `<b>${s}</b><span>${ddmm(w.dni[d])}</span></button>`).join('');

  const list = w.zajecia.filter(visible).map(z => ({ ...z }));
  const box = document.getElementById('sched');
  document.getElementById('hint').hidden = !!(selAudyt.value && selLab.value) || !list.length;
  box.parentElement.hidden = !list.length && !!w.uwaga;
  if (box.parentElement.hidden) return;

  // Zakres osi: od pełnej godziny przed pierwszymi zajęciami do pełnej po ostatnich (min. 8:00–16:00)
  const startMin = Math.min(8 * 60, ...list.map(z => Math.floor(minutes(z.od) / 60) * 60));
  const endMin = Math.max(16 * 60, ...list.map(z => Math.ceil(minutes(z.do) / 60) * 60));
  const hourPx = parseFloat(getComputedStyle(box).getPropertyValue('--hour')) || 72;
  const height = (endMin - startMin) / 60 * hourPx;

  let labels = '';
  for (let m = startMin; m < endMin; m += 60) {
    labels += `<div style="top:${(m - startMin) / 60 * hourPx}px">${m / 60}:00</div>`;
  }

  // Na telefonie jeden dzień (bez nagłówków — zastępują je zakładki), na komputerze cały tydzień
  const shown = mobile.matches ? [day] : [0, 1, 2, 3, 4];
  let html = mobile.matches ? '' : '<div class="corner"></div>' + DAYS.map((name, d) =>
    `<div class="day-head${w.dni[d] === t ? ' is-today' : ''}"><b>${name}</b><span>${ddmm(w.dni[d])}</span></div>`).join('');
  html += `<div class="times" style="height:${height}px">${labels}</div>`;
  html += shown.map(d => {
    const isToday = w.dni[d] === t;
    const items = list.filter(z => z.dzien === d).sort((a, b) => minutes(a.od) - minutes(b.od) || minutes(b.do) - minutes(a.do));
    assignLanes(items);
    const now = nowMinutes();
    const line = isToday && now >= startMin && now <= endMin
      ? `<div class="now-line" style="top:${(now - startMin) / 60 * hourPx}px"></div>` : '';
    const free = items.length ? '' : '<div class="free">Brak zajęć</div>';
    return `<div class="col${isToday ? ' is-today' : ''}" style="height:${height}px">${line}${free}${items.map(z => card(z, isToday, startMin, hourPx)).join('')}</div>`;
  }).join('');
  box.innerHTML = html;
}

// Co minutę odśwież (przesuwa linię "teraz" i znacznik "Trwa teraz")
setInterval(render, 60000);

document.getElementById('prev').addEventListener('click', () => { week--; day = defaultDay(); render(); });
document.getElementById('next').addEventListener('click', () => { week++; day = defaultDay(); render(); });
document.getElementById('todayBtn').addEventListener('click', () => { week = currentWeekIndex(); day = defaultDay(); render(); });

// Kliknięcie zakładki dnia
document.getElementById('dayTabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { day = Number(b.dataset.day); render(); }
});

// Dotknięcie bloku zajęć rozwija / zwija pełny opis
document.getElementById('sched').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (!c) return;
  document.querySelectorAll('.card.open').forEach(o => { if (o !== c) o.classList.remove('open'); });
  c.classList.toggle('open');
});

// Przesunięcie palcem w lewo / prawo zmienia dzień (tylko telefon)
let touchX = null, touchY = null;
const area = document.querySelector('.sched-scroll');
area.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
area.addEventListener('touchend', e => {
  if (touchX === null || !mobile.matches) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  touchX = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftDay(dx < 0 ? 1 : -1);
}, { passive: true });

// Obrót telefonu / zmiana szerokości okna -> przełącz widok
mobile.addEventListener('change', render);
selAudyt.addEventListener('change', () => { save('plan-audyt', selAudyt.value); render(); });
selLab.addEventListener('change', () => { save('plan-lab', selLab.value); render(); });
render();
</script>

</body>
</html>
